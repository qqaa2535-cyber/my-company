<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마이 컴퍼니</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#24263a;--paper:#f3ece0;--card:#fffdf8;--line:#e4dccd;--accent:#ff6b4a;--blue:#3d7bfd;--muted:#857f74;--good:#2fb36b;--bad:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#hud{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ink);color:#fff;flex-wrap:wrap;min-height:52px}
.logo{font-family:Jua;font-size:22px;color:#ffd166;margin-right:4px}
.chip{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;font-size:12.5px;white-space:nowrap}
.spacer{flex:1}
.stress{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.gauge{width:110px;height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:6px;transition:width .4s,background .4s}
.hb{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.hb:hover{background:rgba(255,255,255,.2)}
.hb.red{background:#e5484d;border-color:#e5484d}
.hb.red:hover{background:#ff5a5f}
.hb.yellow{background:#ffd166;color:var(--ink);border-color:#ffd166}
#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
#cv{display:block;border-radius:14px;box-shadow:0 10px 30px rgba(36,38,58,.18);touch-action:none;background:#ddd}
#zoomCtl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:15}
#zoomCtl button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,253,248,.92);font-size:18px;font-weight:700;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.18)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;font-size:12px;color:var(--muted);background:rgba(255,253,248,.85);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;z-index:30}
#toast.show{opacity:1}
.npcmenu{position:absolute;z-index:20;background:var(--card);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.22);padding:8px;width:210px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line)}
.npcmenu .mh{padding:4px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.npcmenu .mh b{font-size:15px}
.npcmenu .mh span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.npcmenu button{text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;font-size:14px;color:var(--ink)}
.npcmenu button:hover{background:#f3ece0}
.npcmenu button.danger{color:var(--bad)}
.hidden{display:none!important}
/* chat */
#chat{position:absolute;right:12px;top:12px;bottom:12px;width:370px;background:var(--card);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;z-index:25;border:1px solid var(--line);overflow:hidden}
.chead{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#2c2f45;color:#fff}
.chead canvas{background:#f3ece0;border-radius:10px;flex:none}
.chead .ci{flex:1;min-width:0}
.chead b{font-size:16px}
.chead .meta{font-size:12px;opacity:.8;margin-top:2px}
.relbar{height:6px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:6px;position:relative;overflow:hidden}
.relbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.chead .x{background:none;border:0;color:#fff;font-size:20px;padding:4px 8px}
.aistate{font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.15);margin-left:6px;vertical-align:2px}
#chatLog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#faf6ee}
.msg{max-width:84%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.npc{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;padding:2px}
.msg.typing{color:var(--muted)}
.modes{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px 4px;border-top:1px solid var(--line)}
.modes .ml{width:100%;font-size:11.5px;color:var(--muted)}
.mode{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 9px;font-size:12.5px}
.mode.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cacts{display:flex;gap:5px;padding:4px 10px;flex-wrap:wrap}
.cacts button{border:0;background:#f3ece0;border-radius:9px;padding:6px 9px;font-size:12.5px}
.cacts button:hover{background:#e9dfcd}
#chatForm{display:flex;gap:6px;padding:8px 10px 12px}
#chatInput{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;min-width:0}
#chatInput:focus{border-color:var(--accent)}
#chatForm button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 16px;font-weight:700}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,30,45,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.sm{max-width:420px}
.modal h2{font-family:Jua;font-weight:400;font-size:26px;margin:0 0 4px}
.modal .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps span{font-size:12px;padding:3px 10px;border-radius:999px;background:#eee6d8;color:var(--muted)}
.steps span.on{background:var(--ink);color:#fff}
.field{display:block;margin-bottom:12px}
.field>.lb{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:#55525a}
.field input[type=text],.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}
.field textarea{resize:vertical;min-height:60px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.ed{display:grid;grid-template-columns:170px 1fr;gap:18px}
.prev{background:linear-gradient(#f7f1e6,#ece2d0);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;position:sticky;top:0;align-self:start}
.prev .pn{font-family:Jua;font-size:18px;margin-top:4px}
.prev .pr{font-size:12px;color:var(--muted)}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.b{border:0;border-radius:11px;padding:10px 18px;font-weight:700;background:#eee6d8;color:var(--ink)}
.b.pri{background:var(--accent);color:#fff}
.b.dark{background:var(--ink);color:#fff}
.b.del{background:none;color:var(--bad);margin-right:auto}
.b:disabled{opacity:.45;cursor:not-allowed}
.rel{display:flex;align-items:center;gap:10px}
.rel input{flex:1;accent-color:var(--accent)}
.rel .rv{font-weight:700;font-size:13px;min-width:86px;text-align:right}
.staffs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sc{border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;background:#fff;cursor:pointer;text-align:left}
.sc:hover{border-color:var(--accent)}
.sc canvas{flex:none;background:#f3ece0;border-radius:10px}
.sc .t{font-weight:700}
.sc .s{font-size:12px;color:var(--muted);margin-top:2px}
.sc.add{justify-content:center;color:var(--muted);font-weight:700;border-style:dashed;min-height:82px}
.seatmap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0;max-width:420px}
.seatmap div{background:#f3ece0;border-radius:9px;padding:7px 4px;text-align:center;font-size:12px}
.seatmap .boss{grid-column:1/4;background:#f0d9c4}
.seatmap .me{background:#ffd7cc;font-weight:700}
.note{font-size:12px;color:var(--muted)}
.setbtns{display:flex;flex-direction:column;gap:8px}
.setbtns .b{text-align:left}
#countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:Jua;font-size:180px;color:#fff;text-shadow:0 0 40px #ff3b1f,0 0 10px #000;z-index:60;pointer-events:none;background:rgba(80,0,0,.25)}
/* battle */
#battle{position:absolute;inset:0;z-index:45;background:#181818;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;touch-action:none}
#gbBox{position:relative;flex:none}
.gbw{width:320px;height:288px;position:absolute;left:0;top:0;transform-origin:0 0}
.gb{position:absolute;inset:0;background:#f8f8f0;overflow:hidden;font-family:'Galmuri11','Galmuri9',ui-monospace,monospace;color:#202020;font-size:13px;line-height:1.3;user-select:none;-webkit-user-select:none;border-radius:3px}
#arena{position:absolute;left:0;top:44px;width:320px;height:176px;image-rendering:pixelated;image-rendering:crisp-edges}
#fHud{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:flex-start;gap:6px;padding:4px 7px 0;background:#f8f8f0;border-bottom:3px solid #303030}
.fs{flex:1;min-width:0}
.fn{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs.right .fn,.fs.right .fw{text-align:right}
.fbar{height:9px;border:2px solid #202020;border-radius:3px;background:#f8f8f0;position:relative;overflow:hidden;margin-top:2px}
.fbar i{position:absolute;top:0;bottom:0;left:0}
.fs.right .fbar i,.fs.right .fg i{left:auto;right:0}
.fbar .dmg{background:#f83800}
.fg{height:4px;background:#d8d8c8;margin-top:2px;position:relative;border-radius:2px;overflow:hidden}
.fg i{position:absolute;top:0;bottom:0;left:0;background:#f8b800}
.fg.full i{background:#f83800;animation:gbblink .4s steps(2) infinite}
.fw{font-size:9px;letter-spacing:2px;margin-top:1px}
.ftime{width:34px;text-align:center;font-size:17px;font-weight:700;border:2px solid #202020;border-radius:4px;padding:2px 0;margin-top:3px;background:#fff;flex:none}
#fBig{position:absolute;left:0;right:0;top:96px;text-align:center;font-size:34px;font-weight:700;color:#f83800;text-shadow:2px 2px 0 #202020,-1px -1px 0 #fff;letter-spacing:2px;pointer-events:none;opacity:0}
#fBig.show{opacity:1}
#fCombo{position:absolute;top:58px;font-size:15px;font-weight:700;color:#f8b800;text-shadow:1px 1px 0 #202020,-1px -1px 0 #202020;pointer-events:none;opacity:0;transition:opacity .3s}
#tBox{position:absolute;left:0;right:0;bottom:0;height:68px;background:#f8f8f0;border:5px double #383838;border-radius:7px;padding:6px 12px;white-space:pre-wrap;font-size:13px;line-height:1.5}
@keyframes gbblink{50%{opacity:0}}
#bFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#bIntro{position:absolute;inset:0;pointer-events:none}
#bIntro i{position:absolute;height:36px;width:0;background:#202020}
#bIntro.go i{animation:gbbar .65s steps(10) forwards}
@keyframes gbbar{to{width:100%}}
#bMute{position:absolute;left:8px;top:8px;z-index:2;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:5px 9px;font-size:14px}
#fPad{display:flex;justify-content:space-between;align-items:center;gap:10px;width:min(100%,520px);padding:0 12px;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
#fPad .grp{display:flex;gap:8px}
#fPad .grp{align-items:center;gap:12px}
#fPad button{width:64px;height:64px;border-radius:50%;border:3px solid #585858;background:#e8e8d8;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#202020;font-family:'Galmuri11',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding:0}
#fPad button small{font-size:10px;margin-top:3px}
#fPad button.on{background:#b8b8a8;transform:scale(.93)}
#fPad button.big{width:86px;height:86px;font-size:30px}
#bRun{position:absolute;right:8px;top:8px;z-index:2;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:5px 10px;font-size:13px}
#fPad button:disabled{opacity:.35}
#spBtn.ready{background:#f8b800;border-color:#f83800;animation:gbblink .5s steps(2) infinite}
#fKeys{color:#9a9a9a;font-size:11.5px;flex:none}
@media (pointer:coarse){#fKeys{display:none}}
@media (max-width:760px){
  #chat{left:6px;right:6px;top:auto;bottom:6px;width:auto;height:52%}
  #stage{align-items:flex-start;padding-top:6px}
  #hCo{display:none}
  .ed{grid-template-columns:1fr}
  .prev{position:static}
  .row3{grid-template-columns:1fr 1fr}
  .gauge{width:70px}
  .logo{font-size:19px}
  #hud .chip.loc{display:none}
  .modal{padding:18px 16px}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <span class="logo">마이 컴퍼니</span>
    <span class="chip" id="hCo"></span>
    <span class="chip loc" id="hLoc"></span>
    <span class="spacer"></span>
    <span class="stress">스트레스 <span class="gauge"><i id="hStress"></i></span> <b id="hStressV"></b></span>
    <button class="hb hidden" id="bShout">📢 소리 지르기</button>
    <button class="hb" id="bStaff">👥 직원</button>
    <button class="hb red" id="bBoom">💣 회사 폭파</button>
    <button class="hb yellow hidden" id="bRebuild">🏗 회사 재건</button>
    <button class="hb" id="bSet">⚙</button>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="menu" class="npcmenu hidden"></div>
    <div id="zoomCtl"><button id="zIn" aria-label="확대">＋</button><button id="zOut" aria-label="축소">－</button><button id="zAll" aria-label="전체 보기">⤢</button></div>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="battle" class="hidden"><button id="bMute" aria-label="소리">🔊</button>
      <div id="gbBox"><div class="gbw" id="gbw"><div class="gb" id="gb">
        <div id="fHud">
          <div class="fs"><div class="fn" id="fPn"></div><div class="fbar"><i class="dmg" id="fPd"></i><i id="fPh"></i></div><div class="fg" id="fPgW"><i id="fPg"></i></div><div class="fw" id="fPw"></div></div>
          <div class="ftime" id="fTime">45</div>
          <div class="fs right"><div class="fn" id="fEn"></div><div class="fbar"><i class="dmg" id="fEd"></i><i id="fEh"></i></div><div class="fg" id="fEgW"><i id="fEg"></i></div><div class="fw" id="fEw"></div></div>
        </div>
        <canvas id="arena" width="160" height="88"></canvas>
        <div id="fBig"></div><div id="fCombo"></div>
        <div id="tBox"><span id="tTx"></span></div>
        <div id="bFlash"></div><div id="bIntro"></div>
      </div></div></div>
      <div id="fPad">
        <div class="grp"><button data-k="l" aria-label="왼쪽">◀</button><button data-k="r" aria-label="오른쪽">▶</button></div>
        <div class="grp"><button data-k="special" id="spBtn">⭐<small>필살</small></button><button data-k="attack" class="big">👊<small>공격</small></button></div>
      </div>
      <div id="fKeys">←→ 이동 (뒤로 누르고 있으면 가드) · J 또는 Space 공격 · K 필살</div>
      <button id="bRun">🏃 도망</button>
    </div>
    <aside id="chat" class="hidden">
      <div class="chead">
        <canvas id="chatAv" width="56" height="64"></canvas>
        <div class="ci">
          <b id="chatName"></b><span class="aistate" id="aiState">AI</span>
          <div class="meta" id="chatMeta"></div>
          <div class="relbar"><i id="chatRel"></i></div>
        </div>
        <button class="x" id="chatClose" aria-label="닫기">✕</button>
      </div>
      <div id="chatLog"></div>
      <div class="modes" id="modes"></div>
      <div class="cacts" id="cacts"></div>
      <form id="chatForm" autocomplete="off">
        <input id="chatInput" maxlength="200" placeholder="하고 싶은 말을 마음껏…">
        <button type="submit">전송</button>
      </form>
    </aside>
  </main>
</div>
<div id="modalRoot"></div>

<div id="countdown" class="hidden"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const W = 960, H = 640;
const RANKS = ['인턴','사원','주임','대리','과장','차장','부장','이사','상무','전무','대표'];
const TAGS = ['꼰대','다혈질','소심함','능글맞음','츤데레','예민함','원칙주의','아부형','무관심','다정함','허세','뒷담화형'];
const TAG_LINES = {
  '꼰대':['라떼는 말이야…','요즘 애들은 참…','보고서 아직이야?','내가 신입 땐 말이지~'],
  '다혈질':['아 진짜 열받네!','누가 내 펜 가져갔어?!','왜 이렇게 느려!'],
  '소심함':['저… 혹시…','(조용히 타자 치는 중)','아, 아니에요…'],
  '능글맞음':['오~ 오늘 좀 멋진데?','점심 뭐 먹을까요~?','에이~ 왜 그래요~'],
  '츤데레':['딱히 걱정한 건 아니고.','커피… 남아서 주는 거야.','흥, 알아서 해.'],
  '예민함':['누가 쩝쩝거려요?','에어컨 좀 꺼주세요.','(한숨)'],
  '원칙주의':['규정상 안 됩니다.','결재 라인 지켜주세요.','기한은 지켜야죠.'],
  '아부형':['역시 탁월하십니다~','오늘 넥타이 최고십니다!','제가 바로 하겠습니다!'],
  '무관심':['(이어폰 꽂는 중)','…네.','(퇴근 시간 확인 중)'],
  '다정함':['간식 드실래요?','오늘도 힘내요!','고생 많으세요~'],

let dbRef=null, saveTimer=null;
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,700);}
function saveNow(){
  for(const k in S.chats){if(S.chats[k].length>40)S.chats[k]=S.chats[k].slice(-40);}
  const pack={state:S,savedAt:Date.now()};
  try{localStorage.setItem('mycompany_save',JSON.stringify(pack));}catch(e){}
  if(dbRef){try{const p=dbRef.set({json:JSON.stringify(S),savedAt:pack.savedAt});if(p&&p.catch)p.catch(()=>{});}catch(e){}}
}
function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);}
async function initDb(){
  if(typeof claude==='undefined'||!claude.use)return;
  try{
    const db=await claude.use('db'), user=await claude.use('user');
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    dbRef=db.collection('data/users/'+id).doc('save');
    let r=await withTimeout(dbRef.get(),10000);
    if(r&&typeof r.data==='function')r=r.data(); else if(r&&r.data!==undefined&&r.json===undefined)r=r.data;
    if(r&&r.json&&(r.savedAt||0)>localSavedAt){
      const st=JSON.parse(r.json);
      S=Object.assign(defaultState(),st);
      closeAllModals(); syncRuntime(); updateHud();
      if(S.setupDone){startGame(true);} else showWizard(1);
    }
  }catch(e){}
}

function staffById(id){return S.staff.find(p=>p.id===id);}
function placeNpc(id,loc,x,y){const r=rt[id];if(!r)return;r.loc=loc;r.path=null;r.dash=null;if(loc==='seat'){const p=staffById(id);const sp=seatPos(p.seat);r.x=sp.x;r.y=sp.y;r.act='sit';r.wt=rnd(5,20);}else{r.x=x;r.y=y;r.act='stay';}r.ox=0;r.oy=0;}

function drawChar(c,x,y,L,st){
  st=st||{};
  c.save();c.translate(x,y);
  if(st.scale)c.scale(st.scale,st.scale);
  c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(0,0,12,4,0,0,Math.PI*2);c.fill();
  const bob=st.walking?Math.abs(Math.sin(T*12))*1.5:0;
  c.translate(0,-bob);
  const oc=L.outfitColor,sk=L.skin,HY=-62,HS=0.74,fem=L.gender==='여',sw=fem?9:10.5;
  const dress=L.outfit==='원피스',skirt=L.outfit==='블라우스'&&fem;

  const step=st.walking?Math.sin(T*12)*1.5:0;
  if(dress||skirt){c.fillStyle=sk;c.fillRect(-5,-22,3.8,20+step);c.fillRect(1.2,-22,3.8,20-step);}
  else{c.fillStyle=L.outfit==='정장'?shade(oc,-25):'#3b3f5c';c.fillRect(-6,-27,5.2,25+step);c.fillRect(0.8,-27,5.2,25-step);}
  c.fillStyle=(dress||skirt)?'#3a2626':'#1f1f24';rr(c,-7,-3.5+step,6.5,3.5,1.5);c.fill();rr(c,0.5,-3.5-step,6.5,3.5,1.5);c.fill();
  // arms
  c.fillStyle=shade(oc,-10);rr(c,-sw-4.2,-49,4.8,24,2.4);c.fill();rr(c,sw-0.6,-49,4.8,24,2.4);c.fill();
  const tyo=st.typing?Math.sin(T*16+x)*1.4:0;c.fillStyle=sk;c.beginPath();c.arc(-sw-1.8,-24.5+tyo,2.3,0,7);c.arc(sw+1.8,-24.5-tyo,2.3,0,7);c.fill();

  c.fillStyle=oc;
  if(dress){c.beginPath();c.moveTo(-sw+0.5,-50);c.lineTo(sw-0.5,-50);c.lineTo(sw+3,-18);c.lineTo(-sw-3,-18);c.closePath();c.fill();}
  else{rr(c,-sw,-50,sw*2,25,4);c.fill();}
  if(skirt){c.fillStyle=shade(oc,-45);c.beginPath();c.moveTo(-sw+0.5,-27);c.lineTo(sw-0.5,-27);c.lineTo(sw+2.5,-17);c.lineTo(-sw-2.5,-17);c.closePath();c.fill();}

    c.strokeStyle=shade(oc,-35);c.lineWidth=1;c.beginPath();c.moveTo(-4,-50);c.lineTo(-1.5,-40);c.moveTo(4,-50);c.lineTo(1.5,-40);c.moveTo(0,-38);c.lineTo(0,-28);c.stroke();}
  else if(L.outfit==='셔츠'){c.fillStyle=shade(oc,-18);c.beginPath();c.moveTo(-5,-50);c.lineTo(0,-46);c.lineTo(5,-50);c.lineTo(0,-48.5);c.closePath();c.fill();c.fillStyle='#3d5a99';c.fillRect(-1,-47,2,12);c.fillStyle='rgba(0,0,0,.25)';for(let i=0;i<3;i++){c.beginPath();c.arc(0,-33+i*3,0.6,0,7);c.fill();}}
  else if(L.outfit==='니트'){c.strokeStyle=shade(oc,30);c.lineWidth=1.1;for(let i=0;i<4;i++){c.beginPath();c.moveTo(-sw+1,-45+i*5);c.lineTo(sw-1,-45+i*5);c.stroke();}}
  else if(L.outfit==='후드티'){c.fillStyle=shade(oc,-25);rr(c,-sw-0.5,-52,sw*2+1,6,3);c.fill();c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.moveTo(-2.5,-47);c.lineTo(-2.5,-39);c.moveTo(2.5,-47);c.lineTo(2.5,-39);c.stroke();c.fillStyle=shade(oc,-15);rr(c,-6,-34,12,6,2);c.fill();}
  else if(L.outfit==='블라우스'){c.fillStyle='#fff';c.beginPath();c.moveTo(-5,-50);c.lineTo(0,-45);c.lineTo(5,-50);c.closePath();c.fill();c.fillStyle=shade(oc,-35);c.beginPath();c.arc(0,-45,1.5,0,7);c.fill();}
  else if(dress){c.fillStyle=shade(oc,-30);c.fillRect(-sw-0.5,-37,sw*2+1,2);}
  if(st.coffee>0){c.fillStyle='rgba(110,65,30,.75)';c.beginPath();c.arc(-3,-40,4.5,0,7);c.arc(3,-35,3.2,0,7);c.arc(-5,-31,2.2,0,7);c.fill();}
  if(st.soot){c.fillStyle='rgba(40,35,35,.5)';[[-3,-42,4],[5,-34,3.5],[-2,-15,3]].forEach(a=>{c.beginPath();c.arc(a[0],a[1],a[2],0,7);c.fill();});}

  if(st.pie>0){c.fillStyle='#fffaf0';c.beginPath();c.ellipse(0,2,9.5,10,0,0,7);c.fill();c.fillStyle='#f6e7c8';c.beginPath();c.arc(-3,4,2.5,0,7);c.arc(4,-1,2,0,7);c.fill();c.fillStyle='#fffaf0';c.fillRect(-6,10,3,5);c.fillRect(3,10,2.5,7);}
  if(st.soot){c.fillStyle='rgba(40,35,35,.55)';[[-5,-4,3.5],[6,5,3],[-7,6,2.2]].forEach(a=>{c.beginPath();c.arc(a[0],a[1],a[2],0,7);c.fill();});
    c.strokeStyle='rgba(90,90,90,.5)';c.lineWidth=1.4;for(let i=0;i<3;i++){const sx=-6+i*6,o=Math.sin(T*3+i)*2;c.beginPath();c.moveTo(sx,-14);c.quadraticCurveTo(sx+3+o,-19,sx,-24);c.stroke();}}
  if(st.stun>0){for(let i=0;i<3;i++){const a=T*5+i*2.094;drawStar(c,Math.cos(a)*13,-18+Math.sin(a)*4,4,'#ffd166');}}
  c.restore();
  c.restore();
}
function drawStar(c,x,y,r,col){c.fillStyle=col;c.strokeStyle='#c98a00';c.lineWidth=0.8;c.beginPath();for(let i=0;i<10;i++){const rr2=i%2?r*0.45:r,a=-Math.PI/2+i*Math.PI/5;c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}c.closePath();c.fill();c.stroke();}
function cap(c,hy,r,yoff,dip){c.beginPath();c.arc(0,hy+yoff,r,Math.PI,0);c.quadraticCurveTo(0,hy+yoff-dip,-r,hy+yoff);c.closePath();c.fill();}
function drawHairBack(c,L,hy){
  c.fillStyle=L.hairColor;
  if(L.hair==='장발'){rr(c,-13.8,hy-6,27.6,31,9);c.fill();}
  else if(L.hair==='단발'){rr(c,-13.8,hy-6,27.6,18,7);c.fill();}
  else if(L.hair==='포니테일'){c.beginPath();c.ellipse(12.5,hy+2,5,11,0.4,0,7);c.fill();}
  else if(L.hair==='파마'){[[-12,hy+3],[12,hy+3],[-10,hy+9],[10,hy+9]].forEach(a=>{c.beginPath();c.arc(a[0],a[1],5.5,0,7);c.fill();});}
}
function drawHairFront(c,L,hy){
  c.fillStyle=L.hairColor;
  switch(L.hair){
    case '숏컷':cap(c,hy,12.4,-1,7);rr(c,-12.4,hy-2,3,6,1.5);c.fill();rr(c,9.4,hy-2,3,6,1.5);c.fill();break;
    case '투블럭':cap(c,hy,12.6,-4,10);c.fillStyle=shade(L.hairColor,35);rr(c,-12,hy-4,2.4,7,1);c.fill();rr(c,9.6,hy-4,2.4,7,1);c.fill();break;
    case '단발':cap(c,hy,12.9,-1,5);rr(c,-13.6,hy-3,5,14,2.5);c.fill();rr(c,8.6,hy-3,5,14,2.5);c.fill();break;
    case '장발':cap(c,hy,12.9,-1,5);rr(c,-13.8,hy-3,5,22,2.5);c.fill();rr(c,8.8,hy-3,5,22,2.5);c.fill();break;
    case '포니테일':cap(c,hy,12.4,-1,6);c.fillStyle='#e74c3c';c.beginPath();c.arc(10.5,hy-7,2.2,0,7);c.fill();break;
    case '파마':cap(c,hy,13,-1,6);for(let a=-1.3;a<=1.31;a+=0.43){c.beginPath();c.arc(Math.sin(a)*12.5,hy-1-Math.cos(a)*12.5,4.6,0,7);c.fill();}break;
    case '대머리':c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(-4,hy-7,3.2,1.7,-0.4,0,7);c.fill();c.fillStyle=L.hairColor;rr(c,-12.6,hy-1,3,6,1.5);c.fill();rr(c,9.6,hy-1,3,6,1.5);c.fill();break;
  }
}
function drawFace(c,L,hy,st){
  const emo=st.stun>0?'dizzy':(st.emo||'neutral');
  const ey=hy+1,ex=4.2,ink='#2a2320',brow=shade(L.hairColor==='#9aa0a6'?'#6b6f75':L.hairColor,-10);
  c.lineCap='round';c.strokeStyle=ink;c.fillStyle=ink;c.lineWidth=1.1;
  // eyes
  if(emo==='dizzy'){c.lineWidth=1.2;c.beginPath();[-ex,ex].forEach(x=>{c.moveTo(x-1.6,ey-1.6);c.lineTo(x+1.6,ey+1.6);c.moveTo(x+1.6,ey-1.6);c.lineTo(x-1.6,ey+1.6);});c.stroke();}
  else if(emo==='happy'){c.beginPath();[-ex,ex].forEach(x=>{c.moveTo(x-2,ey+0.6);c.quadraticCurveTo(x,ey-1.6,x+2,ey+0.6);});c.stroke();}
  else{const ry=emo==='scared'?2.3:emo==='smug'?0.9:1.7;
    [-ex,ex].forEach(x=>{c.fillStyle='#fff';c.beginPath();c.ellipse(x,ey,2.2,ry+0.3,0,0,7);c.fill();c.fillStyle=ink;c.beginPath();c.ellipse(x+0.2,ey,1.2,ry,0,0,7);c.fill();});
    c.strokeStyle=ink;c.lineWidth=0.9;c.beginPath();[-ex,ex].forEach(x=>{c.moveTo(x-2.4,ey-1.4);c.quadraticCurveTo(x,ey-2.6,x+2.4,ey-1.4);});c.stroke();}
  // brows
  c.strokeStyle=brow;c.lineWidth=L.gender==='여'?1:1.5;c.beginPath();
  if(emo==='angry'){c.moveTo(-7,ey-5.5);c.lineTo(-2,ey-3.5);c.moveTo(7,ey-5.5);c.lineTo(2,ey-3.5);}
  else if(emo==='sad'||emo==='scared'){c.moveTo(-7,ey-3.8);c.lineTo(-2,ey-5.5);c.moveTo(7,ey-3.8);c.lineTo(2,ey-5.5);}
  else{c.moveTo(-6.8,ey-4.4);c.quadraticCurveTo(-4.4,ey-5.4,-2,ey-4.6);c.moveTo(6.8,ey-4.4);c.quadraticCurveTo(4.4,ey-5.4,2,ey-4.6);}
  c.stroke();
  // nose
  c.strokeStyle=shade(L.skin,-50);c.lineWidth=0.9;c.beginPath();c.moveTo(0.3,hy+2.5);c.lineTo(1.1,hy+5.6);c.lineTo(-0.6,hy+6);c.stroke();
  // mouth
  const my=hy+8.6;c.strokeStyle='#7a3b33';c.lineWidth=1.1;c.beginPath();
  if(emo==='happy'){c.moveTo(-2.6,my-0.3);c.quadraticCurveTo(0,my+2.2,2.6,my-0.3);c.stroke();}
  else if(emo==='angry'){c.moveTo(-2.6,my+0.8);c.quadraticCurveTo(0,my-1,2.6,my+0.8);c.stroke();c.fillStyle='rgba(230,60,60,.16)';c.beginPath();c.ellipse(0,hy,10.3,12,0,0,7);c.fill();}
  else if(emo==='sad'){c.moveTo(-2.2,my+1);c.quadraticCurveTo(0,my-0.8,2.2,my+1);c.stroke();c.fillStyle='#6fb7ff';c.beginPath();c.ellipse(-ex,ey+3.5+Math.sin(T*4)*0.6,1,1.8,0,0,7);c.fill();}
  else if(emo==='scared'||emo==='dizzy'){c.ellipse(0,my+0.4,1.4,1.8,0,0,7);c.stroke();if(emo==='scared'){c.fillStyle='#8fd0ff';c.beginPath();c.ellipse(9,hy-5,1.4,2.3,0,0,7);c.fill();}}
  else if(emo==='smug'){c.moveTo(-2,my);c.quadraticCurveTo(1,my+1,3,my-1.2);c.stroke();}
  else{c.moveTo(-2,my);c.lineTo(2,my);c.stroke();}
  c.lineWidth=1;
}

function hitObs(x,y,sc){const rad=9;const b=BOUNDS[sc];if(x<b[0]||x>b[2]||y<b[1]||y>b[3])return true;

/* ---------- canvas ---------- */
const cv=$('#cv'), ctx=cv.getContext('2d');
let scale=1, dpr=1;
let baseS=1,Z=null,defZ=1,CW=0,CH=0;const cam={x:0,y:0};
function ZMAX(){return Math.max(1,2.4/baseS);}
function fit(){
  const st=$('#stage').getBoundingClientRect();
  CW=Math.max(200,Math.floor(st.width-8));CH=Math.max(160,Math.floor(st.height-8));
  dpr=window.devicePixelRatio||1;
  cv.style.width=CW+'px';cv.style.height=CH+'px';cv.width=Math.round(CW*dpr);cv.height=Math.round(CH*dpr);
  baseS=Math.min(CW/W,CH/H);
  const cover=Math.max(CW/W,CH/H)/baseS;
  defZ=baseS<0.75?clamp(Math.max(cover,0.85/baseS),1,ZMAX()):1;
  if(Z==null)Z=defZ;
  setZoom(Z);snapCam();
}
function setZoom(z){Z=clamp(z,1,ZMAX());scale=baseS*Z;}
function camTarget(){const vw=CW/scale,vh=CH/scale;let x=P.x-vw/2,y=P.y-30-vh/2;
  x=vw>=W?(W-vw)/2:clamp(x,0,W-vw);y=vh>=H?(H-vh)/2:clamp(y,0,H-vh);return{x,y};}
function snapCam(){const t=camTarget();cam.x=t.x;cam.y=t.y;}
function w2s(x,y){return{x:(x-cam.x)*scale,y:(y-cam.y)*scale};}

/* ---------- wandering (A*) ---------- */
const GS=16,GX=Math.ceil(W/GS),GY=Math.ceil(H/GS);let GRIDW=null;

function nearCell(x,y){const i=Math.floor(x/GS),j=Math.floor(y/GS);if(gridOK(i,j))return[i,j];for(let rad=1;rad<5;rad++)for(let dj=-rad;dj<=rad;dj++)for(let di=-rad;di<=rad;di++){if(gridOK(i+di,j+dj))return[i+di,j+dj];}return null;}
function los(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y);const n=Math.ceil(d/6);for(let k=1;k<=n;k++){if(hitObs(a.x+(b.x-a.x)*k/n,a.y+(b.y-a.y)*k/n,'office'))return false;}return true;}
function findPath(sx,sy,tx,ty){
  const s=nearCell(sx,sy),t=nearCell(tx,ty);if(!s||!t)return null;
  const N=GX*GY,g=new Float32Array(N).fill(1e9),came=new Int32Array(N).fill(-1),closed=new Uint8Array(N);
  const si=s[1]*GX+s[0],ti=t[1]*GX+t[0];g[si]=0;
  const heap=[];
  const push=(f,i)=>{heap.push([f,i]);let k=heap.length-1;while(k>0){const q=(k-1)>>1;if(heap[q][0]<=heap[k][0])break;[heap[q],heap[k]]=[heap[k],heap[q]];k=q;}};
  const pop=()=>{const top=heap[0];const last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top;};
  const hh=i=>Math.hypot(i%GX-t[0],Math.floor(i/GX)-t[1]);
  push(hh(si),si);
  while(heap.length){const cur=pop()[1];if(closed[cur])continue;if(cur===ti)break;closed[cur]=1;const ci=cur%GX,cj=(cur/GX)|0;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){if(!di&&!dj)continue;const ni=ci+di,nj=cj+dj;if(!gridOK(ni,nj))continue;if(di&&dj&&(!gridOK(ci+di,cj)||!gridOK(ci,cj+dj)))continue;
      const n=nj*GX+ni,ng=g[cur]+(di&&dj?1.414:1);if(ng<g[n]){g[n]=ng;came[n]=cur;push(ng+hh(n),n);}}}
  if(si!==ti&&came[ti]<0)return null;

  cells.reverse();
  const pts=cells.map(k=>({x:(k%GX)*GS+8,y:((k/GX)|0)*GS+8}));
  if(!hitObs(tx,ty,'office'))pts.push({x:tx,y:ty});
  const out=[];let a={x:sx,y:sy},idx=0;

  return out;
}
function startWalk(p,r,fromHere){

  if(scene==='office'&&Math.random()<0.35)opts.push({x:P.x+28,y:P.y+4,player:true});
  const poi=Math.random()<0.25&&scene==='office'&&opts[opts.length-1].player?opts[opts.length-1]:pick(opts);

  if(poi.player)return ban?pick(['뭐 해? 바빠?','야, 커피 한잔할래?','일은 잘 돼가?']):pick(['뭐 하세요? 바쁘세요?','커피 한잔하실래요?','일은 잘 되세요?']);
  if(poi.visit){const q=staffById(poi.visit);return q?pick([`(${q.name}에게 소곤소곤)`,`${q.name}, 점심 뭐 먹어?`,'(수다 떠는 중)']):'(어슬렁)';}
  return pick(poi.say);}
function wanderStep(p,r,dt){
  if(S.exploded||r.loc!=='seat')return;
  if(r.stun>0||r.dash||chatId===p.id||menuId===p.id)return;
  if(r.act==='sit'||r.act==='idle'){r.wt-=dt;if(r.wt>0)return;
    if(r.act==='sit'){if(Math.random()<0.6)startWalk(p,r,false);else r.wt=rnd(6,16);}
    else{if(Math.random()<0.3)startWalk(p,r,true);else goHome(p,r);}
    return;}
  if(!r.path||!r.path.length){
    if(r.act==='walk'){r.act='idle';r.wt=rnd(3,8);if(r.poi&&r.bubT<=0&&Math.random()<0.75)say(p.id,poiLine(p,r.poi),null,2.8);}
    else{const sp=seatPos(p.seat);r.x=sp.x;r.y=sp.y;r.act='sit';r.wt=rnd(10,28);}
    return;}
  const t=r.path[0],dx=t.x-r.x,dy=t.y-r.y,d=Math.hypot(dx,dy),sp=72*dt;
  if(d<=sp){r.x=t.x;r.y=t.y;r.path.shift();}else{r.x+=dx/d*sp;r.y+=dy/d*sp;}
}
function checkTriggers(){
  for(const tr of TRIG[scene]){if(inRect(P.x,P.y,tr)){
    if(scene==='street'&&S.exploded){toast('회사가 무너져서 들어갈 수 없어요. 재건부터!');P.y+=14;return;}
    goScene(tr.go,scene);return;}}
}
function goScene(to,from,px,py){
  closeMenu();
  if(from==='roof'){for(const p of S.staff){if(rt[p.id]&&rt[p.id].loc==='roof')placeNpc(p.id,'seat');}}
  if(from==='office'&&to==='street'){for(const p of S.staff){if(rt[p.id]&&rt[p.id].loc==='meeting')placeNpc(p.id,'seat');}}
  let sp;
  if(px!=null)sp=[px,py];
  else if(to==='office')sp=from==='roof'?SPAWN.office.fromRoof:SPAWN.office.fromStreet;
  else if(to==='street')sp=SPAWN.street.fromOffice;
  else sp=SPAWN.roof.fromOffice;
  scene=to;fx.length=0;projs.length=0;P.x=sp[0];P.y=sp[1];P.tx=null;fadeT=0.35;

}
function render(){
  const c=ctx;c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#2a2c3d';c.fillRect(0,0,CW,CH);
  c.setTransform(scale*dpr,0,0,scale*dpr,-cam.x*scale*dpr,-cam.y*scale*dpr);
  c.save();
  if(shakeT>0){c.translate(rnd(-1,1)*shakeAmp*Math.min(1,shakeT),rnd(-1,1)*shakeAmp*Math.min(1,shakeT));}
  if(scene==='office')drawOffice(c);else if(scene==='street')drawStreet(c);else drawRoof(c);
  const list=npcsInScene();
  const seated=p=>rt[p.id].loc==='seat'&&rt[p.id].act==='sit';
  const drawNpc=p=>{const r=rt[p.id];drawChar(c,r.x+r.ox,r.y+r.oy,p,{emo:r.emo,stun:r.stun,soot:r.soot,pie:r.pie,coffee:r.coffee,typing:seated(p)&&!r.dash,walking:r.act==='walk'||r.act==='return'});};
  if(scene==='office'){list.filter(seated).forEach(drawNpc);drawOfficeFront(c);}
  const ents=[];
  list.forEach(p=>{if(!(scene==='office'&&seated(p)))ents.push({y:rt[p.id].y+rt[p.id].oy,f:()=>drawNpc(p)});});
  ents.push({y:P.y,f:()=>drawChar(c,P.x+P.ox,P.y+P.oy,S.me,{walking:P.walking||!!P.dash,soot:S.exploded,stun:P.stun,pie:P.pie,coffee:P.coffee,emo:S.stress<25?'happy':S.stress>75?'angry':'neutral'})});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  // projectiles
  for(const q of projs){const k=q.t/q.dur;const x=q.x0+(q.x1-q.x0)*k,y=q.y0+(q.y1-q.y0)*k-Math.sin(k*Math.PI)*70;c.save();c.translate(x,y);c.rotate(k*12);c.font='24px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(q.item.e,0,0);c.restore();}
  // tags
  list.forEach(p=>{const r=rt[p.id];drawTag(c,r.x+r.ox,r.y+r.oy-90,p,false);});
  drawTag(c,P.x+P.ox,P.y+P.oy-90,S.me,true);
  const near=nearestNpc(80);
  if(near&&!menuId&&!chatId){const r=rt[near.id];c.fillStyle='#ffd166';rr(c,r.x+r.ox+28,r.y+r.oy-92,20,18,5);c.fill();c.fillStyle='#24263a';c.font='bold 12px sans-serif';c.textAlign='center';c.fillText('E',r.x+r.ox+38,r.y+r.oy-79);}
  drawFx(c);
  list.forEach(p=>{const r=rt[p.id];if(r.bubT>0)drawBubble(c,r.x+r.ox,r.y+r.oy-94,r.bubble);});
  if(P.bubT>0)drawBubble(c,P.x,P.y-94,P.bubble);
  c.restore();
  if(fadeT>0){c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle=`rgba(20,20,30,${fadeT/0.35})`;c.fillRect(0,0,CW,CH);}
}
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(S.setupDone)update(dt);else T+=dt;
  const ct=camTarget();if(Math.hypot(ct.x-cam.x,ct.y-cam.y)>260){cam.x=ct.x;cam.y=ct.y;}else{const k=Math.min(1,dt*6);cam.x+=(ct.x-cam.x)*k;cam.y+=(ct.y-cam.y)*k;}
  render();if(menuId)positionMenu();requestAnimationFrame(frame);}

function positionMenu(){
  if(!menuId)return;const r=rt[menuId];if(!r){closeMenu();return;}
  const st=$('#stage').getBoundingClientRect(),rc=cv.getBoundingClientRect();
  const sp=w2s(r.x+r.ox,r.y+r.oy-74);let x=rc.left-st.left+sp.x+30,y=rc.top-st.top+sp.y;
  const mw=menu.offsetWidth||210,mh=menu.offsetHeight||300;
  if(x+mw>st.width-6)x=rc.left-st.left+sp.x-mw-60;
  x=clamp(x,6,st.width-mw-6);y=clamp(y,6,st.height-mh-6);
  menu.style.left=x+'px';menu.style.top=y+'px';

function closeMenu(){menuId=null;menu.classList.add('hidden');}
menu.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const id=menuId;const a=b.dataset.a;
  if(a==='throwMenu'){menu.innerHTML=`<div class="mh"><b>무엇을 던질까요?</b><span>${esc(staffById(id).name)}에게</span></div>`+ITEMS.map(it=>`<button data-a="throw" data-item="${it.id}">${it.e} ${it.name}</button>`).join('')+'<button data-a="backMenu">← 뒤로</button>';positionMenu();return;}
  if(a==='backMenu'){openMenu(id);return;}
  closeMenu();doAction(a,id,b.dataset.item);
});
function doAction(a,id,item){
  if(a==='chat')openChat(id);
  else if(a==='meeting')callMeeting(id);
  else if(a==='roof')callRoof(id);
  else if(a==='punch')doPunch(id);
  else if(a==='battle')startBattle(id);
  else if(a==='throw')doThrow(id,ITEMS.find(i=>i.id===item)||ITEMS[0]);
  else if(a==='back'){placeNpc(id,'seat');sysChat(id,'↩ 자리로 돌려보냈다.');toast(josa(staffById(id).name,'은','는')+' 자리로 돌아갔어요.');}
  else if(a==='edit')openEditor(id);
  if(chatId){renderCacts();refreshChatHead();}
}

function detectIntent(t){const s=t.replace(/\s+/g,' ').trim().replace(/^(저기요?|야|어이|\S{1,6}님|\S{1,4}씨)[,!.\s]+/,'');
  if(s.length<=7&&/^(왜|왜요|뭐|뭐요|뭔데|네\?|응\?|그래서|그래서요|진짜|정말|진짜요)[?!.~ ]*$/.test(s))return'follow';
  if(s.length<=8&&/^(아니|아니요|아뇨|됐어|됐어요|됐고|몰라|싫어)/.test(s))return'deny';
  for(const [k,re] of INTENTS)if(re.test(s))return k;
  if(/[?？]$|^(왜|뭐|어떻게|언제|누가|어디)/.test(s))return'question';
  return'other';}
function boss0(p){return relationTo(p)==='상사';}
function pickCls(p,mode,intent,st){
  if(mode==='fight')return'push';if(mode==='sorry'||mode==='panic'||mode==='cry')return'soft';if(mode==='ignore')return'dodge';
  const tg=p.tags;let h=-p.relation/55+st.heat*0.35;
  tg.forEach(t=>{if(['다혈질','꼰대','허세','예민함','원칙주의'].includes(t))h+=0.55;if(['다정함','소심함','아부형'].includes(t))h-=0.6;});
  if(['thanks','userSorry','tired','greet','lunch'].includes(intent))h-=0.6;
  if(['insult','tone','apologyReq','credit','gossip','curse','gen','lazy','blame','compare','challenge'].includes(intent))h+=0.3;if(intent==='threat')h+=(boss0(p)?0.4:-0.5);
  if(tg.some(t=>['무관심','능글맞음'].includes(t))&&Math.random()<0.35)return'dodge';
  if(h>0.45)return Math.random()<0.85?'push':'dodge';
  if(h<-0.35)return Math.random()<0.85?'soft':'dodge';
  const r=Math.random();return r<0.45?'push':r<0.8?'soft':'dodge';}
function smartReply(p,mode,text){
  const st=DLG[p.id]=DLG[p.id]||{heat:0,last:null,turn:0,used:[]};
  let intent=detectIntent(text||'');
  const topicIntent=(intent==='follow'||intent==='deny')?(st.last||'other'):intent;
  const cls=pickCls(p,mode,topicIntent,st);
  const boss=relationTo(p)==='상사',ban=speechOf(p)==='ban',J=ban?1:0;
  let src=(DL[intent]||DL.other)[cls]||DL.other[cls];
  if(!Array.isArray(src))src=(boss?src.b:src.o)||src.b||src.o;
  const fresh=src.filter(x=>!st.used.includes(x));const line=pick(fresh.length?fresh:src);
  st.used.push(line);if(st.used.length>12)st.used.shift();
  const others=S.staff.filter(x=>x.id!==p.id).map(x=>x.name);
  const q=(text||'').replace(/[.!?~…]+$/,'').trim();
  const fill=s=>s.replace(/\{q\}/g,q.length>14?q.slice(0,14)+'…':q).replace(/\{other\}/g,others.length?pick(others):'다른 분').replace(/\{rank\}/g,S.me.rank).replace(/\{topic\}/g,TOPIC[topicIntent]||'그 얘기');
  let out=fill(line.split('|')[J]||line.split('|')[0]);
  if(intent!=='follow'&&intent!=='deny'&&st.last===intent&&st.turn>0&&Math.random()<0.6)out=(ban?'또 그 얘기야? ':'또 그 얘기예요? ')+out;
  const loc=rt[p.id]?rt[p.id].loc:'seat';
  if(cls==='push'&&!['follow','deny'].includes(intent)){
    const jb=boss?JAB.b:JAB.o;const pool=JAB.any.concat(jb,loc==='seat'?JAB.seat:loc==='meeting'?JAB.meeting:loc==='roof'?JAB.roof:[]);
    if(Math.random()<0.25+st.heat*0.12){const jl=pick(pool);if(!st.used.includes(jl)){st.used.push(jl);out+=' '+fill(jl.split('|')[J]||jl.split('|')[0]);}}
    if(st.heat>=3&&Math.random()<0.5&&!/^좋아/.test(out))out=(ban?'좋아, 끝까지 가 보자. ':'좋아요, 끝까지 가 봐요. ')+out;}
  if(/[!！]{2,}/.test(text||'')&&cls!=='soft'&&Math.random()<0.6)out=(ban?'소리 지르지 마. ':'소리 지르지 마세요. ')+out;
  if(OPEN[mode])out=pick(OPEN[mode])+out;
  else if(mode==='auto'){const ot=p.tags.find(t=>TAG_OPEN[t]);if(ot&&cls!=='dodge'&&Math.random()<0.4)out=TAG_OPEN[ot]+out;
    const tt=p.tags.find(t=>TAG_TAIL[t]);const tailOk=tt&&(tt==='능글맞음'?cls!=='soft':['다정함','츤데레'].includes(tt)?(cls==='soft'&&(tt==='츤데레'||['tired','frustr','workload','overtime','quit','eval'].includes(topicIntent))):cls==='push'&&(['뒷담화형'].includes(tt)||['overtime','workload','leave','quit','salary','frustr','tired','insult','tone','eval','micro','report','meeting','credit','gen','kakao','airpods','errand','hoesik','lazy','why3','compare','curse'].includes(topicIntent)));if(tailOk&&Math.random()<0.35&&(st.tails=st.tails||0)<2){st.tails++;const v=TAG_TAIL[tt].split('|');out+=fill(v[J]||v[0]);}}
  if(['insult','tone','frustr','apologyReq','gen','lazy','blame','compare'].includes(intent))st.heat=Math.min(5,st.heat+1);if(['curse','threat','challenge'].includes(intent))st.heat=Math.min(5,st.heat+2);if(cls==='soft')st.heat=Math.max(0,st.heat-1);
  st.last=topicIntent;st.turn++;
  const emotion=mode!=='auto'?MODE_EMO[mode]:cls==='push'?(st.heat>=2?'angry':pick(['angry','smug'])):cls==='soft'?(['userSorry','apologyReq','insult'].includes(topicIntent)?'sad':'happy'):'smug';
  const delta=mode!=='auto'?DELTA[mode]:cls==='push'?(intent==='curse'?-10:['insult','threat'].includes(intent)?-6:-3):cls==='soft'?3:-1;
  return{reply:out,emotion,delta};}
async function getReply(p,mode){
  const smp=await getSample();
  if(smp){
    try{
      const r=await smp(buildPrompt(p,mode),{modelTier:'quick',cache:false});
      const o=parseJSON(r&&r.text);
      if(o&&o.reply)return{reply:String(o.reply).slice(0,300),emotion:EMO.includes(o.emotion)?o.emotion:MODE_EMO[mode],delta:clamp(parseInt(o.delta,10)||0,-15,15)};
    }catch(e){
      if(e&&e.code==='not_granted'){sampleFn=null;sampleState='none';refreshChatHead();}
      else if(e&&e.code==='rate_limited')toast('AI가 잠시 쉬는 중이라 기본 대사로 대답해요.');
    }
  }
  const lastMe=[...(S.chats[p.id]||[])].reverse().find(m=>m.who==='me');
  const res=smartReply(p,mode,lastMe?lastMe.text:'');
  await new Promise(r=>setTimeout(r,clamp(350+res.reply.length*14,500,1300)));
  return res;
}

function openModal(html,cls,lock){

}

function bindEditor(root,d,isMe){
  const upd=()=>{
    const cvs=root.querySelector('#edPrev');const c=cvs.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,300,340);
    drawChar(c,150,330,d,{scale:4.0,emo:isMe?'happy':(d.relation<-20?'angry':d.relation>40?'happy':'neutral')});
    root.querySelector('#edPn').textContent=d.name||'(이름)';
    root.querySelector('#edPr').textContent=isMe?`${d.rank} · ${seatLabel(d.seat)}`:`${d.rank} · 나의 ${relationTo(d)} · ${speechOf(d)==='ban'?'반말':'존댓말'} · ${seatLabel(d.seat)}`;
    const rv=root.querySelector('#edRelV');if(rv){rv.textContent=`${relLabel(d.relation)} (${d.relation})`;rv.style.color=relColor(d.relation);}
  };
  root.querySelectorAll('.opts[data-k]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=g.dataset.k;
    d[k]=k==='glasses'?b.dataset.v==='1':b.dataset.v;g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));upd();}));
  root.querySelector('#edName').addEventListener('input',e=>{d.name=e.target.value.trim()||'이름없음';upd();});
  root.querySelector('#edRank').addEventListener('change',e=>{d.rank=e.target.value;upd();});
  root.querySelector('#edSeat').addEventListener('change',e=>{d.seat=parseInt(e.target.value,10);upd();});
  if(!isMe){
    root.querySelector('#edTags').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;const i=d.tags.indexOf(t);if(i>=0)d.tags.splice(i,1);else d.tags.push(t);b.classList.toggle('on',i<0);});
    root.querySelector('#edMemo').addEventListener('input',e=>{d.memo=e.target.value;});
    root.querySelector('#edRel').addEventListener('input',e=>{d.relation=parseInt(e.target.value,10);upd();});
  }
  upd();
}
function applySeat(d,oldSeat){
  const all=[S.me,...S.staff];const other=all.find(p=>p.seat===d.seat&&p.id!==d.id);
  if(other){let free=oldSeat;if(free==null||all.some(p=>p.seat===free&&p.id!==d.id&&p.id!==other.id)){free=[0,1,2,3,4,5,6].find(i=>!all.some(p=>p.seat===i&&p.id!==other.id&&p.id!==d.id));}other.seat=free;}
}
function freeSeat(){const all=[S.me,...S.staff];return [1,2,3,4,5,6,0].find(i=>!all.some(p=>p.seat===i));}

    if(E.gauge>=100&&d<36&&Math.random()<0.6){E.tele=0.45;E.walk=0;setTxt(`${BT.p.name}의\n${BT.eSp}!!`);return;}
    if(d>24)E.walk=Math.random()<0.35+BT.ai.aggr*0.6?1:(Math.random()<0.3?-1:0);
    else if(Math.random()<BT.ai.aggr){tryAtk(E,Math.random()<0.6?'punch':'kick');E.walk=0;return;}
    else E.walk=Math.random()<0.4?-1:0;}

function updF(f,o,dt){
  if(f.comboT>0){f.comboT-=dt;if(f.comboT<=0)f.combo=0;}
  f.x+=f.vx*dt;f.vx*=Math.pow(0.004,dt);
  if(f.y<0||f.vy<0){f.vy+=420*dt;f.y+=f.vy*dt;if(f.y>=0){f.y=0;f.vy=0;}}
  f.x=clamp(f.x,10,AW-10);
  if(f.st==='ko'){f.koT+=dt;return;}
  if(f.st!=='atk')f.face=o.x>=f.x?1:-1;
  if(f.st==='hit'){f.hitT=(f.hitT||0)+dt;f.hitstun-=dt;if(f.hitstun<=0&&f.y===0)f.st='idle';return;}
  if(f.st==='atk'){f.t+=dt;const a=ATK[f.act];
    if(!f.hitDone&&f.t>=a.su&&f.t<a.su+a.ac){const d=(o.x-f.x)*f.face;if(d>-4&&d<=a.rng+6&&Math.abs(o.y-f.y)<22&&o.st!=='ko'){f.hitDone=true;landHit(f,o,a,f.act);}}
    if(f.t>=a.su+a.ac+a.rc){f.st='idle';f.act=null;}}}
function spark(x,y,cols,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(30,95);BT.sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.15,.35),t:0,col:pick(cols)});}}
function landHit(A,D,a,kind){const isP=A===BT.P;const guarded=D.st==='guard';
  let dmg=a.dmg*A.mult*rnd(0.9,1.1);const hx=(A.x+D.x)/2,hy=FLOOR+D.y-(kind==='kick'?24:44);
  if(guarded&&kind!=='special'){dmg*=0.12;if(D===BT.E&&Math.random()<BT.ai.aggr+0.25){D.guardT=Math.min(D.guardT,0.1);D.punish=1;}D.vx=A.face*a.kb*0.5;spark(hx,hy,['#d8d8d8','#fff','#9aa0a6'],6);snd('guard');D.gauge=Math.min(100,D.gauge+6);
    if(isP&&Math.random()<0.4)setTxt(`${josa(BT.p.name,'은','는')} 가드했다!`);}
  else{if(guarded)dmg*=0.6;
    const cs=Math.max(0.35,1-0.15*Math.max(0,(A.comboT>0?A.combo:0)));D.st='hit';D.act=null;D.hitT=0;D.hitstun=a.stun*cs;dmg*=Math.max(0.5,cs);D.vx=A.face*a.kb;D.guardT=0;D.tele=0;if(a.launch){D.vy=-150;D.y=-0.5;}
    A.combo=A.comboT>0?A.combo+1:1;A.comboT=0.9;A.gauge=Math.min(100,A.gauge+(kind==='special'?0:9));D.gauge=Math.min(100,D.gauge+6);
    spark(hx,hy,kind==='special'?['#f8b800','#f83800','#fff']:['#f8d030','#fff','#f87830'],kind==='special'?18:9);
    BT.shake=kind==='special'?0.35:0.15;snd(kind==='special'?'big':'hit');if(kind==='special')BT.slow=0.45;
    if(A.combo>=2)showCombo(isP,A.combo);
    if(A.combo>=5&&kind!=='special'){D.hitstun=0.08;D.vx=A.face*140;if(D===BT.E)D.guardT=0.5;}
    if(isP){if(kind!=='special'&&Math.random()<0.35)setTxt(pick(kind==='kick'?['로우킥이 꽂혔다!','발차기가 들어갔다!']:['잽! 잽!','원투가 들어갔다!','팩트 폭행!']));}
    else if(kind!=='special'&&Math.random()<0.35)setTxt(`${BT.p.name}의 ${pick(BT.eNames)}!`);}
  D.hp=Math.max(0,D.hp-dmg);
  if(D.hp<=0){D.st='ko';D.koT=0;D.vy=-130;D.y=-0.5;D.vx=A.face*80;roundEnd(isP?'P':'E','ko');}}
function roundEnd(w,why){if(BT.phase!=='fight')return;BT.phase='end';if(why==='ko')BT.slow=1.0;showBig(why==='ko'?'K.O.!':'TIME UP',1500);BT.wins[w]++;updWins();
  const L=w==='P'?BT.E:BT.P;if(why==='time'&&L.st!=='ko'){L.st='hit';L.hitstun=1.6;}
  setTimeout(()=>snd(w==='P'?'win':'lose'),300);
  setTimeout(()=>{if(!BT.on)return;if(BT.wins[w]>=2)finish(w);else newRound();},2300);}
function finish(w){BT.phase='over';const e=BT.p,me=S.me.name;
  if(w==='P'){setTxt(`${josa(e.name,'은','는')} 쓰러졌다!\n${josa(me,'은','는')} 경험치 ${BT.eLv*7}을(를) 얻었다!`);setTimeout(()=>endBattle('win'),2600);}
  else{setTxt(`${me}의 멘탈이 바닥났다!\n${josa(me,'은','는')} 눈앞이 캄캄해졌다…`);setTimeout(()=>endBattle('lose'),2600);}}
function bUpdate(dt,raw){const P=BT.P,E=BT.E;BT.bt+=raw;
  if(BT.phase==='fight'){BT.time-=raw;if(BT.time<=0){BT.time=0;roundEnd(P.hp/P.max>=E.hp/E.max?'P':'E','time');}}
  if(BT.phase==='fight'){ctrlP(dt);aiStep(E,P,dt);}else{[P,E].forEach(f=>{if(f.st==='walk'||f.st==='guard')f.st='idle';});}
  updF(P,E,dt);updF(E,P,dt);
  const dx=E.x-P.x;if(Math.abs(dx)<14&&P.st!=='ko'&&E.st!=='ko'&&Math.abs(P.y-E.y)<10){const pu=(14-Math.abs(dx))/2*(dx>=0?1:-1);P.x=clamp(P.x-pu,10,AW-10);E.x=clamp(E.x+pu,10,AW-10);}
  for(let i=BT.sparks.length-1;i>=0;i--){const s=BT.sparks[i];s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=200*dt;if(s.t>s.life)BT.sparks.splice(i,1);}
  BT.shake=Math.max(0,BT.shake-raw);
  [P,E].forEach(f=>{f.show+=(f.hp-f.show)*Math.min(1,raw*2.5);});
  updHud();}
function drawFighter(c,f){
  const L=f.L,sk=L.skin,oc=L.outfitColor,hc=L.hairColor,st=f.st,bt=BT.bt;

  c.translate(0,Math.round(f.y));c.scale(f.face,1);

  const fist=(x,y)=>{c.fillStyle=sk;c.fillRect(x-2,y-2,4,4);};
  // legs
  c.fillStyle=bare?sk:pants;
  if(a==='kick'&&k>=ATK.kick.su*0.5){c.fillRect(-4,-24,4,23);c.fillRect(2,-27,21,4);c.fillStyle='#202020';c.fillRect(22,-28,3,6);c.fillRect(-5,-2,6,2);}
  else{const w=st==='walk'?Math.round(Math.sin(bt*16)*2):0;c.fillRect(-5+w,-24,4,23);c.fillRect(1-w,-24,4,23);c.fillStyle='#202020';c.fillRect(-6+w,-2,6,2);c.fillRect(0-w,-2,6,2);}
  // back arm
  c.fillStyle=shade(oc,-22);
  if(st==='guard'){c.fillRect(2+lean,-45,3,9);fist(6+lean,-51+bob);}
  else if(st==='hit'||st==='ko'){c.fillRect(-6,-46,3,8);fist(-6,-49);}
  else{c.fillRect(1+lean,-43+bob,6,3);fist(8+lean,-44+bob);}
  // torso
  c.fillStyle=oc;c.fillRect(-5+lean,-47,11,24);
  if(bare){c.fillStyle=shade(oc,-30);c.beginPath();c.moveTo(-6+lean,-27);c.lineTo(7+lean,-27);c.lineTo(9+lean,-17);c.lineTo(-8+lean,-17);c.closePath();c.fill();}
  else if(L.outfit!=='후드티'){c.fillStyle='#202020';c.fillRect(-5+lean,-25,11,1);}
  if(L.outfit==='정장'||L.outfit==='셔츠'){c.fillStyle='#fff';c.fillRect(3+lean,-47,3,4);c.fillStyle='#b03030';c.fillRect(4+lean,-45,1,9);}
  else if(L.outfit==='후드티'){c.fillStyle=shade(oc,-25);c.fillRect(-6+lean,-49,5,6);}
  else if(L.outfit==='니트'){c.fillStyle=shade(oc,30);for(let i=0;i<4;i++)c.fillRect(-5+lean,-43+i*5,11,1);}

  else if(L.hair==='포니테일'){c.fillRect(hx-9,hy-3,4,7);c.fillStyle='#e74c3c';c.fillRect(hx-6,hy-2,1,2);}

  if(L.hair==='대머리'){c.fillStyle='rgba(255,255,255,.55)';c.fillRect(hx-1,hy-5,3,1);c.fillStyle=hc;c.fillRect(hx-5,hy-1,2,3);}
  else{c.beginPath();c.ellipse(hx-0.5,hy-1.5,5.3,4.8,0,Math.PI,Math.PI*2);c.fill();c.fillRect(hx-5.6,hy-2,3,5);
    if(L.hair==='파마'){for(let i=-4;i<=3;i+=2.5){c.beginPath();c.arc(hx+i,hy-5.5,1.8,0,7);c.fill();}}

  else{c.fillRect(hx+3,hy-0.5,1,1);c.fillStyle=shade(hc,-10);c.fillRect(hx+2,hy-2.5,3,1);c.fillStyle='#7a3b33';c.fillRect(hx+2.5,hy+3,2,1);}

  else if(a==='special'&&k>=ATK.special.su*0.6){c.fillRect(4+lean,-68,3,22);fist(5+lean,-70);c.fillStyle='rgba(248,184,0,.75)';c.fillRect(1+lean,-77,10,4);c.fillRect(3+lean,-81,6,3);}

  else if(st==='hit'||st==='ko'){c.fillRect(3,-47,3,7);fist(7,-51);}
  else{c.fillRect(3+lean,-42+bob,7,3);fist(11+lean,-42+bob);}
  c.restore();
  if(f.tele>0){c.fillStyle='#f83800';c.fillRect(Math.round(f.x)-1,FLOOR+Math.round(f.y)-80,3,7);c.fillRect(Math.round(f.x)-1,FLOOR+Math.round(f.y)-71,3,3);}
}
function bDraw(){const c=$b('arena').getContext('2d');c.setTransform(1,0,0,1,0,0);c.imageSmoothingEnabled=false;
  const sx=BT.shake>0?Math.round(rnd(-2,2)):0,sy=BT.shake>0?Math.round(rnd(-1,1)):0;c.translate(sx,sy);

  c.fillStyle='#d6cdb4';c.fillRect(4,40,34,16);c.fillRect(122,40,34,16);c.fillStyle='#5a6075';c.fillRect(10,32,12,9);c.fillRect(138,32,12,9);

  c.fillStyle='#f83800';c.fillRect(0,50,AW,1);c.fillStyle='#f8f8f8';c.fillRect(0,54,AW,1);

function bLoop(now){if(!BT.on)return;const raw=Math.min(0.05,(now-BT.last)/1000);BT.last=now;let dt=raw;if(BT.slow>0){BT.slow-=raw;dt=raw*0.3;}

function endBattle(res){const id=BT.id,p=BT.p;BT.on=false;if(BT.releasePad)BT.releasePad();clearInterval(txTimer);BT.keys={l:0,r:0,g:0};$b('battle').classList.add('hidden');

function battleKey(e,down){const k=e.key.length===1?e.key.toLowerCase():e.key;

(function(){const pad=$b('fPad');const held=new Map();
